apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
  namespace: execution
  labels:
    app: execution-service
data:
  QUARKUS_HTTP_HOST: "0.0.0.0"
  QUARKUS_LOG_LEVEL: INFO

  # Trocados no deploy pelo cd.yml; aplicados crus, a app sobe sem fila e sem tópico.
  EXECUTION_COMMANDS_QUEUE_URL: __EXECUTION_COMMANDS_QUEUE_URL__
  EXECUTION_EVENTS_TOPIC_ARN: __EXECUTION_EVENTS_TOPIC_ARN__
  EXECUTION_TABLE_NAME: __EXECUTION_TABLE_NAME__
  OS_INTERNAL_BASE_URL: __OS_INTERNAL_BASE_URL__

  JWT_PUBLIC_KEY_LOCATION: file:/deployments/secrets/publicKey.pem
