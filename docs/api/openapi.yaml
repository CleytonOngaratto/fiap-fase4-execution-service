---
openapi: 3.1.0
tags:
- name: Execution queue
- name: Info
- name: Mechanic
components:
  schemas:
    CompleteDiagnosisRequest:
      type: object
      properties:
        description:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosedItemRequest"
    DiagnosedItemRequest:
      type: object
      properties:
        type:
          type: string
        catalogId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
    FailureRequest:
      type: object
      properties:
        reason:
          type: string
    InfoResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    QueueItemResponse:
      type: object
      properties:
        workOrderId:
          type: integer
          format: int64
        branchId:
          type: string
        status:
          type: string
        enqueuedAt:
          $ref: "#/components/schemas/Instant"
        vehiclePlate:
          type: string
        complaint:
          type: string
        mechanic:
          type: string
        diagnosisDescription:
          type: string
        itemCount:
          type: integer
          format: int32
  securitySchemes:
    SecurityScheme:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentication
paths:
  /execution/v1/info:
    get:
      summary: Service name and version
      tags:
      - Info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
  /execution/v1/queue:
    get:
      summary: "Execution queue of a branch, oldest first"
      tags:
      - Execution queue
      parameters:
      - name: branchId
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 25
      - name: status
        in: query
        schema:
          type: string
          default: DIAGNOSIS_QUEUED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItemResponse"
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/diagnosis/complete:
    post:
      summary: Mechanic completes the diagnosis with a description and the catalog
        items
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteDiagnosisRequest"
        required: true
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/diagnosis/fail:
    post:
      summary: Mechanic records that there is no viable repair
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailureRequest"
        required: true
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/diagnosis/start:
    post:
      summary: Mechanic starts the diagnosis
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/repair/complete:
    post:
      summary: Mechanic completes the repair
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/repair/fail:
    post:
      summary: Mechanic records that the repair failed
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailureRequest"
        required: true
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
        "400":
          description: Bad Request
      security:
      - SecurityScheme:
        - ADMIN
  /execution/v1/work-orders/{id}/repair/start:
    post:
      summary: Mechanic starts the repair
      tags:
      - Mechanic
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: X-Trace-Id
        in: header
        schema:
          type: string
      responses:
        "200":
          description: OK
        "401":
          description: Not Authorized
        "403":
          description: Not Allowed
      security:
      - SecurityScheme:
        - ADMIN
info:
  title: Execution Service API
  version: 1.0.0
  description: Fila de diagnostico e reparo por filial (DynamoDB). Participante da
    Saga orquestrada pelo OS Service.
