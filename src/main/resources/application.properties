quarkus.application.name=execution-service
quarkus.http.port=8080
quarkus.http.root-path=/execution/v1

mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/publicKey.pem}
mp.jwt.verify.issuer=https://oficina-api.com
mp.jwt.verify.groups.path=groups
# Necessario para /info e /q/* continuarem respondendo: /info e o smoke da borda, e com a negacao por padrao
# ligada ele passaria a exigir token e o deploy quebraria. Todo endpoint protegido e anotado explicitamente.
quarkus.security.jaxrs.deny-unannotated-endpoints=false

quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=default
quarkus.sns.aws.region=us-east-1
quarkus.sns.aws.credentials.type=default
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=default
# Sem isto cada extensao sobe um LocalStack sozinha a cada @QuarkusTest, inclusive no CI. O SNS nao se
# protege por endpoint-override: o ElasticMQ nao emula SNS.
quarkus.sqs.devservices.enabled=false
quarkus.sns.devservices.enabled=false
quarkus.dynamodb.devservices.enabled=false

execution.commands.queue-url=${EXECUTION_COMMANDS_QUEUE_URL:}
execution.events.topic-arn=${EXECUTION_EVENTS_TOPIC_ARN:}
execution.commands.batch-size=10
execution.table-name=${EXECUTION_TABLE_NAME:}
execution.inbox.retention=${EXECUTION_INBOX_RETENTION:P7D}
execution.outbox.relay.batch-size=10
execution.events.publish-to-log=${EXECUTION_EVENTS_PUBLISH_TO_LOG:false}

# O pipeline entrega o HOST do ALB interno; o esquema fica aqui, porque trocar por HTTPS numa conta real e
# decisao de configuracao e nao de pipeline. No laboratorio o ALB so fala HTTP, dentro da VPC.
execution.catalog.base-url=http://${OS_INTERNAL_HOST:localhost:8080}
execution.catalog.service-token=${OS_INTERNAL_SERVICE_TOKEN:dev-service-token}
execution.catalog.timeout=${OS_CATALOG_TIMEOUT:PT2S}
execution.catalog.max-attempts=${OS_CATALOG_MAX_ATTEMPTS:2}
execution.catalog.circuit.failure-threshold=${OS_CATALOG_FAILURE_THRESHOLD:3}
execution.catalog.circuit.open-duration=${OS_CATALOG_CIRCUIT_OPEN:PT30S}

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Execution Service API
quarkus.smallrye-openapi.info-description=Fila de diagnostico e reparo por filial (DynamoDB). Esqueleto: por enquanto so o /info.

quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service.name".value=execution-service
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.oidc.enabled=false
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem

# Chaves ficticias: o ElasticMQ nao as valida, e a cadeia padrao falharia no CI, que nao tem ~/.aws/credentials.
%dev.quarkus.sqs.endpoint-override=http://localhost:9324
%dev.quarkus.sqs.aws.credentials.type=static
%dev.quarkus.sqs.aws.credentials.static-provider.access-key-id=elasticmq
%dev.quarkus.sqs.aws.credentials.static-provider.secret-access-key=elasticmq
%dev.execution.commands.queue-url=http://localhost:9324/000000000000/execution-commands.fifo
# A chave do DynamoDB Local tem de ser alfanumerica: com hifen ou sublinhado ele responde
# "The Access Key ID or security token is invalid", que parece credencial errada e nao e.
%dev.quarkus.dynamodb.endpoint-override=http://localhost:8000
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=dynamodblocal
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=dynamodblocal
%dev.execution.table-name=execution
%dev.execution.events.publish-to-log=true
# Exigido mesmo sem publicar no SNS: o ARN entra como String no modulo de configuracao, e valor vazio conta
# como ausente para o MicroProfile Config - a aplicacao nao sobe.
%dev.execution.events.topic-arn=arn:aws:sns:us-east-1:000000000000:execution-events.fifo

%test.quarkus.sqs.endpoint-override=http://localhost:9324
%test.quarkus.sqs.aws.credentials.type=static
%test.quarkus.sqs.aws.credentials.static-provider.access-key-id=elasticmq
%test.quarkus.sqs.aws.credentials.static-provider.secret-access-key=elasticmq
%test.quarkus.sns.aws.credentials.type=static
%test.quarkus.sns.aws.credentials.static-provider.access-key-id=sns-fake
%test.quarkus.sns.aws.credentials.static-provider.secret-access-key=sns-fake
%test.execution.commands.queue-url=http://localhost:9324/000000000000/execution-commands.fifo
%test.execution.events.topic-arn=arn:aws:sns:us-east-1:000000000000:execution-events.fifo
%test.quarkus.dynamodb.endpoint-override=http://localhost:8000
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=dynamodblocal
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=dynamodblocal
%test.execution.table-name=execution
%test.execution.events.publish-to-log=true
%test.execution.catalog.base-url=http://localhost:9999
%test.execution.catalog.service-token=test-service-token
