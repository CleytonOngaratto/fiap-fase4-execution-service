quarkus.application.name=execution-service
quarkus.http.port=8080
quarkus.http.root-path=/execution/v1

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Execution Service API
quarkus.smallrye-openapi.info-description=Fila de diagnostico e reparo por filial (DynamoDB). Esqueleto: por enquanto so o /info.

quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service.name".value=execution-service
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
